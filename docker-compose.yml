version: '3.3'

services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: prestashop_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: prestashop_user
      MYSQL_PASSWORD: prestashop_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - prestashop_network
    logging:
      driver: json-file

  prestashop:
    image: prestashop/prestashop:latest
    environment:
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: admin_password
      DB_NAME: prestashop_db
      DB_PASSWD: prestashop_password
      DB_PREFIX: ps_
      DB_SERVER: mysql
      DB_USER: prestashop_user
      PS_DOMAIN: localhost
      PS_ENABLE_SSL: '0'  # SSL désactivé pour le localhost
      PS_FOLDER_ADMIN: admin
      PS_FOLDER_INSTALL: install
      PS_INSTALL_AUTO: '1'
      PS_LANGUAGE: fr
    ports:
      - "80:80"  # Port local pour accéder à PrestaShop
    volumes:
      - psdata:/var/www/html
    networks:
      - prestashop_network
    logging:
      driver: json-file

networks:
  prestashop_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  psdata:
    driver: local
