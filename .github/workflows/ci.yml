name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PrestaShop 8.0 supports PHP 7.2.5+, PrestaShop 9 requires 8.1+.
        php: ['7.2', '7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find injellikrecommendations -name '*.php' -print0 | xargs -0 -n1 php -l

  install:
    name: Install on PrestaShop ${{ matrix.ps }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ps: ['8.2', '9.0']
    env:
      PS_VERSION: ${{ matrix.ps }}
    steps:
      - uses: actions/checkout@v4
      - name: Start PrestaShop
        run: docker compose up -d
      - name: Wait for the automatic installation
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T prestashop test -f /var/www/html/app/config/parameters.php \
              && curl -sf -o /dev/null http://localhost:8090/; then exit 0; fi
            sleep 5
          done
          docker compose logs prestashop | tail -50
          exit 1
      - name: Install, check and uninstall the module
        run: |
          docker compose exec -T prestashop php bin/console prestashop:module install injellikrecommendations
          docker compose exec -T prestashop php -r '
            require "config/config.inc.php";
            $m = Module::getInstanceByName("injellikrecommendations");
            if (!Module::isInstalled("injellikrecommendations")) { fwrite(STDERR, "not installed\n"); exit(1); }
            foreach (["AdminInjellikDashboard", "AdminInjellikConfiguration"] as $tab) {
              if (!Tab::getIdFromClassName($tab)) { fwrite(STDERR, "missing tab $tab\n"); exit(1); }
            }
            foreach (InjellikInstaller::hooks() as $hook) {
              if (!$m->isRegisteredInHook($hook)) { fwrite(STDERR, "missing hook $hook\n"); exit(1); }
            }
            echo "OK\n";'
          docker compose exec -T prestashop php bin/console prestashop:module uninstall injellikrecommendations
      - if: failure()
        run: docker compose exec -T prestashop sh -c 'tail -50 var/logs/*.log' || true

  release:
    name: Release archive
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: echo "zip=$(./build.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: injellikrecommendations
          path: ${{ steps.build.outputs.zip }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
